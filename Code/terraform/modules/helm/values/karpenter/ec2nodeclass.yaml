apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2023
  instanceProfile: "${instance_profile}"
  amiSelectorTerms:
    - ssmParameter: "/aws/service/eks/optimized-ami/${eks_version}/amazon-linux-2023/x86_64/standard/recommended/image_id"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "${cluster_name}"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "${cluster_name}"

settings:
  clusterName: ""
  clusterEndpoint: ""
  interruptionQueue: ""

serviceAccount:
  create: true
  name: karpenter

replicas: 2

podDisruptionBudget:
  name: karpenter
  maxUnavailable: 1

controller:
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

priorityClassName: system-cluster-critical
logLevel: info


tolerations:
  - key: CriticalAddonsOnly
    operator: Exists

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: karpenter.sh/nodepool
              operator: DoesNotExist
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - topologyKey: kubernetes.io/hostname
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: karpenter
